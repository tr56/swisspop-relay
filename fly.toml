# fly.toml app configuration file generated for swisspop-relaynl on 2026-11-16T18:54:51Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'swisspop-relaynl'
primary_region = 'ams'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 50
    soft_limit = 25

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
